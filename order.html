
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку — Лапа помощи</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🐾 Лапа помощи</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Главная</a>
            <a class="nav-link" href="catalog.html">Наши животные</a>
            <a class="nav-link active" href="order.html">Оставить заявку</a>
            <a class="nav-link" href="contacts.html">Контакты</a>
        </div>
    </div>
</nav>

<section class="page-header text-center py-5">
    <div class="container">
        <span class="section-label">МЫ ЖДЁМ ИМЕННО ВАС</span>
        <h1 class="section-title mt-2">Оставить заявку</h1>
        <p class="section-subtitle">Расскажите нам, чем мы можем вам помочь</p>
    </div>
</section>

<section class="section-padding">
    <div class="container" style="max-width: 750px;">
        <div class="story-card p-4 p-md-5">
            <form id="orderForm">
                <div class="mb-3">
                    <label class="form-label">Ваше имя</label>
                    <input type="text" class="form-control" name="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Номер телефона</label>
                    <input type="tel" class="form-control" name="phone"
                           placeholder="+7 (___) ___-__-__" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Электронная почта</label>
                    <input type="email" class="form-control" name="email"
                           placeholder="example@mail.ru" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Тип обращения</label>
                    <select class="form-select" name="type" required>
                        <option value="">Выберите вариант</option>
                        <option>Хочу взять животное домой</option>
                        <option>Хочу стать волонтёром</option>
                        <option>Хочу помочь приюту</option>
                        <option>Другой вопрос</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Расскажите подробнее</label>
                    <textarea class="form-control" name="message" rows="4"
                              placeholder="Ваше сообщение..."></textarea>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" required id="agree">
                    <label class="form-check-label" for="agree">
                        Я согласен на обработку персональных данных
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Отправить заявку
                </button>
            </form>
        </div>
    </div>
</section>

<footer class="site-footer text-center py-4">
    <div class="container">
        <p class="mb-0">© 2026 Приют «Лапа помощи». Все права защищены.</p>
    </div>
</footer>

<script>
document.getElementById('orderForm').addEventListener('submit', function(event) {
    event.preventDefault();
    alert('Спасибо! Ваша заявка заполнена. Мы свяжемся с вами!');
    this.reset();
});
</script>

</body>
</html>
